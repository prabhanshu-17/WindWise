version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windwise-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WINDWISE_DB_PATH=/app/data/windwise.db
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - ELEXON_TIMEOUT=30.0
      - ELEXON_MAX_RETRIES=3
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windwise-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: windwise-network

